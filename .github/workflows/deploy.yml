name: Deploy Mobile PWA ke Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-mobile-cf
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci --no-audit --no-fund

      - name: Build PWA
        env:
          VITE_API_BASE: https://curious-lime-sloth.101-50-1-74.cpanel.site/api
        run: npm run build

      - name: Deploy ke Cloudflare Pages (REST API, tanpa wrangler)
        run: bash deploy-pages.sh
